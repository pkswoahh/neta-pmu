<!--
  Plantilla "Confirm signup" para Supabase → Authentication → Email Templates.
  Variable de Supabase: {{ .ConfirmationURL }}
  Subject sugerido: Confirma tu cuenta — Neta.
  Estilo calcado del correo de "Recupera tu contraseña" (paleta: bg #0F0F0F, accent #E8A598).
-->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:520px;background:#0F0F0F;border-radius:20px;">
        <tr>
          <td style="padding:40px;">
            <div style="font-size:32px;font-weight:700;color:#ffffff;line-height:1;">Neta<span style="color:#E8A598;">.</span></div>
            <div style="font-size:14px;color:#9a9a9a;margin-top:8px;">Tu negocio, claro como el agua.</div>

            <p style="font-size:16px;color:#e8e8e8;line-height:1.6;margin:32px 0 0;">
              ¡Te damos la bienvenida! Estás a un paso de empezar.
              Confirma tu correo para activar tu cuenta:
            </p>

            <table cellpadding="0" cellspacing="0" role="presentation" style="margin:28px 0;">
              <tr>
                <td style="border-radius:12px;background:#E8A598;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:600;color:#0F0F0F;text-decoration:none;border-radius:12px;">Confirmar mi cuenta</a>
                </td>
              </tr>
            </table>

            <p style="font-size:13px;color:#777777;line-height:1.6;margin:0;">
              Si no creaste esta cuenta en Neta., puedes ignorar este correo.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
