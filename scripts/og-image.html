<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(60% 70% at 50% 38%, #1A1A1A 0%, #0F0F0F 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
    width: 1040px; height: 720px;
    background: radial-gradient(50% 50% at 50% 50%, rgba(232,165,152,0.28) 0%, rgba(232,165,152,0) 100%);
  }
  .logo {
    font-weight: 700; font-size: 150px; line-height: 1; color: #fff;
    letter-spacing: -2px; position: relative; z-index: 1;
  }
  .logo .dot { color: #E8A598; }
  .tagline {
    margin-top: 28px; font-weight: 400; font-size: 44px; color: #C9C9C9;
    position: relative; z-index: 1;
  }
  .subline {
    margin-top: 36px; font-weight: 500; font-size: 27px; color: #D4A96A;
    letter-spacing: 1px; position: relative; z-index: 1;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="logo">Neta<span class="dot">.</span></div>
  <div class="tagline">Tu negocio, claro como el agua.</div>
  <div class="subline">Gestión para micropigmentadoras</div>
</body>
</html>
