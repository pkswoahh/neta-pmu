<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </radialGradient>
    <radialGradient id="nude" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A598" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E8A598" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <ellipse cx="600" cy="250" rx="520" ry="360" fill="url(#nude)"/>

  <!-- Logo Neta. -->
  <text x="600" y="300" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="150" fill="#FFFFFF">Neta</text>
  <circle cx="828" cy="300" r="20" fill="#E8A598"/>

  <!-- Tagline -->
  <text x="600" y="390" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="42" fill="#C9C9C9">Tu negocio, claro como el agua.</text>

  <!-- Subline -->
  <text x="600" y="460" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="28" fill="#D4A96A" letter-spacing="1">Gestión para micropigmentadoras</text>
</svg>
